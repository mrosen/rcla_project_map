<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotary Club of Lake Atitlán — Project Map</title>
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 14px; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #maintainer-panel { background: #0f172a; color: #f8fafc; padding: 6px 16px; display: none; align-items: center; justify-content: space-between; font-size: 12px; z-index: 1000; border-bottom: 2px solid #3b82f6; flex-shrink: 0; }
    .maint-group { display: flex; align-items: center; gap: 10px; }
    #sync-status-badge { padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 10px; text-transform: uppercase; background: #475569; color: #fff; }
    .maint-btn { color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 11px; transition: opacity 0.15s; }
    .maint-btn:hover { opacity: 0.9; }
    .btn-dry  { background: #3b82f6; }
    .btn-sync { background: #059669; }
    .btn-diff { background: #6366f1; }
    .btn-push { background: #d97706; }
    .btn-new  { background: #8b5cf6; }
    .btn-log  { background: #334155; }
    #log-drawer { display: none; background: #020617; color: #38bdf8; font-family: Consolas, Menlo, Monaco, monospace; font-size: 11px; padding: 8px 16px; height: 120px; overflow-y: auto; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
    .log-line { margin-bottom: 2px; }
    #nav { background: #1a3a5c; color: white; display: flex; align-items: center; padding: 0 16px; height: 48px; flex-shrink: 0; gap: 8px; }
    #nav .club-name { font-size: 15px; font-weight: bold; margin-right: auto; }
    #nav button { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: background 0.15s; }
    #nav button:hover  { background: rgba(255,255,255,0.15); }
    #nav button.active { background: rgba(255,255,255,0.25); border-color: white; }
    #app { display: flex; flex: 1; overflow: hidden; }
    #map-pane { flex: 0 0 55%; position: relative; min-width: 200px; }
    #map { width: 100%; height: 100%; }
    #map-search-container { position: absolute; top: 10px; left: 140px; z-index: 5; width: 240px; max-width: calc(100% - 200px); }
    #map-search-input { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); outline: none; background: #fff; }
    #divider { width: 6px; background: #ddd; cursor: col-resize; flex-shrink: 0; position: relative; transition: background 0.15s; }
    #divider:hover, #divider.dragging { background: #1a3a5c; }
    #divider::after { content: "⋮"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #999; font-size: 14px; pointer-events: none; }
    #right-pane { flex: 1; overflow-y: auto; background: #f7f7f7; display: flex; flex-direction: column; min-width: 200px; }
    .panel { padding: 20px; flex: 1; }
    .panel h2 { font-size: 17px; color: #1a3a5c; margin-bottom: 12px; border-bottom: 2px solid #1a3a5c; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .panel h3 { font-size: 14px; color: #1a3a5c; margin: 16px 0 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .badge-closed   { background: #ffe0b2; color: #e65100; }
    .badge-approved { background: #c8e6c9; color: #1b5e20; }
    .badge-proposed { background: #bbdefb; color: #0d47a1; }
    .badge-type     { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
    #detail-panel .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    #detail-panel .meta-item label { display: block; font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
    #detail-panel .meta-item span { font-size: 13px; color: #222; font-weight: 500; }
    #detail-panel .narrative { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px; line-height: 1.6; color: #444; margin-bottom: 12px; }
    .EasyMDEContainer { margin-bottom: 12px; background: white; }
    .EasyMDEContainer .CodeMirror { font-size: 13px; min-height: 180px; border-color: #cbd5e1; }
    .EasyMDEContainer.editor-fullscreen { position: static !important; width: 100% !important; height: auto !important; z-index: auto !important; }
    .EasyMDEContainer .editor-preview-side { position: static !important; width: 100% !important; }
    .paste-zone { border: 2px dashed #94a3b8; border-radius: 6px; padding: 12px; text-align: center; background: #f8fafc; color: #475569; font-size: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
    .paste-zone:hover, .paste-zone.dragover { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    #diff-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999999; align-items: center; justify-content: center; }
    .diff-content { background: #fff; width: 960px; max-width: 95vw; height: 85vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .diff-body { flex: 1; overflow-y: auto; padding: 16px; background: #0f172a; color: #f8fafc; font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; white-space: pre-wrap; line-height: 1.5; }
    .diff-line-add { color: #4ade80; background: rgba(74, 222, 128, 0.1); display: block; }
    .diff-line-del { color: #f87171; background: rgba(248, 113, 113, 0.1); display: block; }
    .diff-line-hunk { color: #38bdf8; font-weight: bold; margin-top: 8px; display: block; }
    .files-section { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .files-section a { display: flex; align-items: center; gap: 8px; padding: 6px 4px; color: #1a3a5c; text-decoration: none; border-bottom: 1px solid #f0f0f0; }
    .photo-carousel { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .photo-carousel img { height: 140px; border-radius: 6px; cursor: pointer; object-fit: cover; border: 1px solid #ddd; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters select, .filters input { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: white; }
    #list-panel table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border: 1px solid #ddd; }
    #list-panel th { background: #1a3a5c; color: white; text-align: left; padding: 8px 10px; cursor: pointer; user-select: none; }
    #list-panel td { padding: 7px 10px; border-bottom: 1px solid #eee; }
    #list-panel tr:hover td { background: #f0f4f8; cursor: pointer; }
  </style>
</head>
<body>

  <div id="maintainer-panel">
    <div class="maint-group">
      <strong>🛠️ Maint Mode</strong>
      <span id="db-status-badge" style="padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 10px; background: #059669; color: #fff;">⚡ DB: Supabase (Live)</span>
      <button id="btn-toggle-source" class="maint-btn" onclick="toggleDataSource()" style="background:#d97706;font-size:10px;padding:2px 8px;cursor:pointer;" title="Switch between Supabase Cloud and Legacy CSV">⇄ Switch to CSV</button>
      <span id="sync-status-badge" class="local-only-btn">Sync: Connecting...</span>
      <span id="sync-step" class="local-only-btn" style="color: #94a3b8;"></span>
    </div>
    <div class="maint-group">
      <button class="maint-btn btn-new" onclick="openCreateForm()">➕ New Project</button>
      <button id="btn-sync-dry" class="maint-btn btn-dry local-only-btn" onclick="triggerSync(true)">Dry Run Sync</button>
      <button id="btn-sync-live" class="maint-btn btn-sync local-only-btn" onclick="triggerSync(false)">Full Sync</button>
      <button id="btn-diff" class="maint-btn btn-diff local-only-btn" onclick="showDiffModal()">🔍 Diff</button>
      <button id="btn-publish" class="maint-btn btn-push local-only-btn" onclick="publishChanges()">Push to Git</button>
      <button class="maint-btn btn-log local-only-btn" onclick="toggleLogConsole()">Logs</button>
      <button class="maint-btn" onclick="toggleMaintenanceMode(false)" style="background:#475569;font-size:10px;padding:2px 8px;margin-left:4px;" title="Exit maintenance mode">✕ Exit Maint</button>
    </div>
  </div>

  <div id="log-drawer"><div id="log-output">-- Orchestrator log stream initialized --</div></div>

  <!-- Diff Modal -->
  <div id="diff-modal">
    <div class="diff-content">
      <div style="background:#1a3a5c;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;font-size:15px;">🔍 Git Workspace Diff (Pending Changes)</h3>
        <button onclick="closeDiffModal()" style="background:transparent;border:none;color:white;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="diff-body" id="diff-output-container">Loading diff...</div>
      <div style="padding:12px 16px;background:#f1f5f9;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e2e8f0;">
        <span id="diff-file-count" style="font-size:12px;color:#475569;"></span>
        <div style="display:flex;gap:10px;">
          <button onclick="closeDiffModal()" style="background:#94a3b8;color:white;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;">Close</button>
          <button onclick="closeDiffModal(); publishChanges();" style="background:#d97706;color:white;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-weight:bold;">Proceed to Push</button>
        </div>
      </div>
    </div>
  </div>

  <div id="nav">
    <span class="club-name">Rotary Club of Lake Atitlán — Projects</span>
    <button id="btn-overview" class="active">Overview</button>
    <button id="btn-list">Projects</button>
    <div id="backend-status-indicator" onclick="handleBackendIndicatorClick(event)" style="display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:12px;background:rgba(16,185,129,0.18);border:1px solid #10b981;color:#34d399;font-weight:600;margin-left:8px;cursor:pointer;user-select:none;transition:all 0.2s;" title="Database status (Click to toggle Maintainer Mode, or press Ctrl+Shift+M)">
      <span style="width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399;"></span>
      <span id="backend-status-text">⚡ Supabase Cloud</span>
    </div>
  </div>
  <div id="app">
    <div id="map-pane">
      <div id="map-search-container"><input id="map-search-input" type="text" placeholder="🔍 Search place or school..."></div>
      <div id="map"></div>
    </div>
    <div id="divider"></div>
    <div id="right-pane"><div id="loading">Loading project data…</div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
  <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Load our app first, synchronously.  GitHub or Local (testing)  -->
    <!--    
    <script src="https://mrosen.github.io/rcla_project_map/main.js"></script>
    -->
    <script src="main.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCO2h4ZlPyPDPuZaK1ljB2Rq3ZR_-b9178&libraries=places&callback=initMap" async defer></script>
</body>
</html>
